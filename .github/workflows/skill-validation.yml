# GitHub Actions automatic triggers are disabled to avoid consuming GitHub Action minutes.
# Execute local skill validation via `make skill` or `make local-ci`.
name: Skill Validation

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[hermes,dev]"

    - name: Run Smoke Tests
      run: |
        python scripts/smoke_skill.py

    - name: Run Validation Suite
      run: |
        pytest tests/test_skill.py -q
